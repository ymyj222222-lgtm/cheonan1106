<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>오늘 뭐 먹지? | 나만의 맛집 추천</title>
<style>
:root{--bg:#f8f6fc;--ink:#252038;--muted:#817b90;--purple:#7047d8;--purple2:#9e77f0;--line:#e9e4f0;--white:#fff;--soft:#f1eaff;--shadow:0 16px 36px rgba(49,31,91,.09)}*{box-sizing:border-box}body{margin:0;font-family:Pretendard,'Noto Sans KR',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:var(--bg);color:var(--ink)}button,input,select{font:inherit}button{cursor:pointer}button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid #c5b3ff;outline-offset:2px}.app{max-width:1170px;margin:0 auto;padding:0 24px 72px}.topbar{display:flex;align-items:center;justify-content:space-between;padding:23px 0}.brand{font-size:21px;font-weight:850;letter-spacing:-.7px}.brand span{color:var(--purple)}.mini-tag{font-size:12px;background:#eee8fb;border-radius:100px;padding:8px 12px;color:var(--purple);font-weight:750}.hero{position:relative;overflow:hidden;background:linear-gradient(115deg,#6e43d8,#9465e8 66%,#a578ea);color:white;border-radius:30px;min-height:236px;padding:38px 42px;display:flex;align-items:center;justify-content:space-between;box-shadow:var(--shadow)}.hero h1{margin:0 0 10px;font-size:clamp(30px,4vw,44px);letter-spacing:-2px;line-height:1.25}.hero p{margin:0;color:#ede4ff;font-size:15px;line-height:1.7}.hero .emoji{font-size:110px;transform:rotate(-13deg);filter:drop-shadow(0 12px 10px #38237833);margin-right:30px}.bubble{position:absolute;width:290px;height:290px;border-radius:50%;background:#ffffff12;right:-110px;top:-140px}.panel{background:white;border:1px solid var(--line);border-radius:22px;padding:24px;margin-top:22px;box-shadow:0 7px 21px #27174a05}.controls{display:grid;grid-template-columns:1.25fr 1fr 1fr 1fr;gap:14px}.field label{display:block;color:#655d78;font-size:13px;font-weight:780;margin-bottom:9px}.field input,.field select{width:100%;height:46px;border:1px solid #e4dfec;background:#faf9fd;border-radius:12px;padding:0 13px;color:var(--ink)}.actions{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-top:18px}.btn{border:1px solid var(--line);background:white;color:#4a405e;border-radius:12px;min-height:43px;padding:0 17px;font-weight:800;transition:transform .15s,background .15s}.btn:hover{transform:translateY(-2px)}.btn.primary{border-color:var(--purple);background:var(--purple);color:white}.btn.soft{border:0;background:var(--soft);color:var(--purple)}.btn.active{border-color:var(--purple);color:var(--purple);background:#f5f0ff}.result-section{margin-top:31px}.sectionbar{display:flex;justify-content:space-between;align-items:end;gap:14px;margin-bottom:16px}.sectionbar h2{font-size:23px;letter-spacing:-.8px;margin:0 0 5px}.sectionbar p{margin:0;color:var(--muted);font-size:13px}.result-count{font-size:13px;color:#776c89}.cards{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:17px}.card{background:white;border-radius:20px;overflow:hidden;border:1px solid var(--line);box-shadow:0 6px 16px #29194d07;transition:transform .18s,box-shadow .18s}.card:hover{transform:translateY(-3px);box-shadow:var(--shadow)}.card-art{height:153px;display:flex;align-items:center;justify-content:center;position:relative;background:linear-gradient(135deg,var(--a),var(--b))}.dish{font-size:72px;filter:drop-shadow(0 8px 7px #00000012)}.category-pill{position:absolute;top:14px;left:14px;background:#ffffffde;border-radius:40px;padding:7px 10px;font-size:12px;font-weight:800}.heart{position:absolute;top:12px;right:12px;width:36px;height:36px;border:none;background:#ffffffed;border-radius:50%;font-size:19px;color:#aaa}.heart.saved{color:#e85d91}.card-body{padding:19px}.card-top{display:flex;align-items:center;justify-content:space-between;gap:10px}.card-title{font-size:18px;font-weight:850;letter-spacing:-.6px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.rating{font-size:13px;color:#b67f21;white-space:nowrap;font-weight:800}.desc{margin:9px 0 13px;color:#80798c;font-size:13px;line-height:1.6;min-height:40px}.meta{display:flex;gap:7px;flex-wrap:wrap}.meta span{background:#f6f3fa;color:#726a81;padding:6px 9px;font-size:12px;border-radius:8px}.card-bottom{margin-top:17px;display:flex;justify-content:space-between;gap:10px;align-items:center;border-top:1px solid #f2eef6;padding-top:14px}.map-link{color:var(--purple);text-decoration:none;font-size:13px;font-weight:850}.map-link:hover{text-decoration:underline}.remove{background:none;border:0;color:#a5a0ae;font-size:12px}.empty{grid-column:1/-1;background:white;border:1px dashed #d7cce8;border-radius:22px;text-align:center;padding:54px 15px;color:#756d86}.empty strong{display:block;color:#342b48;font-size:19px;margin:12px 0 7px}.tip{margin-top:27px;color:#898196;font-size:12px;line-height:1.7}.tip strong{color:#675b80}.modal-wrap{position:fixed;inset:0;background:#1b122aaa;display:flex;align-items:center;justify-content:center;padding:18px;z-index:20}.modal{width:100%;max-width:495px;max-height:90vh;overflow:auto;background:white;border-radius:22px;padding:27px;box-shadow:0 28px 80px #0004}.modal h2{margin:0 0 9px;font-size:23px}.modal .hint{color:var(--muted);font-size:13px;line-height:1.65;margin:0 0 20px}.modal-grid{display:grid;grid-template-columns:1fr 1fr;gap:13px}.modal-grid .wide{grid-column:1/-1}.modal-footer{display:flex;justify-content:end;gap:10px;margin-top:23px}.toast{position:fixed;bottom:28px;left:50%;transform:translateX(-50%);padding:13px 20px;background:#302446;color:white;border-radius:14px;box-shadow:var(--shadow);font-size:14px;z-index:50}.recommend{position:fixed;inset:0;background:#1b122ab5;display:flex;align-items:center;justify-content:center;z-index:30;padding:20px}.recommend-box{max-width:430px;width:100%;background:white;text-align:center;border-radius:28px;padding:35px 25px;box-shadow:0 24px 90px #0004}.recommend-emoji{font-size:80px}.recommend-box .eyebrow{color:var(--purple);font-weight:900;font-size:13px}.recommend-box h2{font-size:30px;margin:10px 0}.recommend-box p{color:var(--muted);font-size:14px;line-height:1.7}.recommend-box .actions{justify-content:center}.footer{text-align:center;font-size:12px;color:#b2aabd;margin-top:36px}@media(max-width:850px){.controls{grid-template-columns:1fr 1fr}.cards{grid-template-columns:repeat(2,minmax(0,1fr))}.hero .emoji{font-size:85px;margin-right:0}}@media(max-width:580px){.app{padding:0 15px 48px}.topbar{padding:17px 2px}.hero{padding:29px 24px;min-height:210px;border-radius:23px}.hero h1{font-size:31px}.hero .emoji{display:none}.panel{padding:18px}.controls{grid-template-columns:1fr 1fr;gap:12px}.field:first-child{grid-column:1/-1}.cards{grid-template-columns:1fr}.card-art{height:168px}.sectionbar{align-items:start}.modal-grid{grid-template-columns:1fr}.modal-grid .wide{grid-column:auto}.btn{padding:0 12px;font-size:13px}.mini-tag{font-size:11px}}
</style>
</head>
<body>
<main class="app">
<header class="topbar"><div class="brand">🍽️ 오늘<span>뭐먹지?</span></div><span class="mini-tag">나만의 맛집 큐레이션</span></header>
<section class="hero"><div><h1>오늘 점심, 어디로 갈까?</h1><p>취향에 딱 맞는 식당을 찾아보세요.<br>고민될 땐 랜덤 추천으로 결정 끝!</p></div><div class="emoji" aria-hidden="true">🍜</div><div class="bubble"></div></section>
<section class="panel" aria-label="맛집 검색 필터"><div class="controls"><div class="field"><label for="search">식당명 · 지역 · 메뉴 검색</label><input id="search" placeholder="예: 두정동, 파스타, 초밥" /></div><div class="field"><label for="area">지역</label><select id="area"><option value="">모든 지역</option></select></div><div class="field"><label for="category">음식 종류</label><select id="category"><option value="">모든 음식</option><option>한식</option><option>일식</option><option>중식</option><option>양식</option><option>카페</option><option>기타</option></select></div><div class="field"><label for="budget">1인 예산</label><select id="budget"><option value="">상관없음</option><option value="10000">1만원 이하</option><option value="15000">1만 5천원 이하</option><option value="20000">2만원 이하</option><option value="30000">3만원 이하</option></select></div></div><div class="actions"><button class="btn primary" id="random">🎲 오늘의 메뉴 추천</button><button class="btn soft" id="add">＋ 나만의 맛집 추가</button><button class="btn" id="favorites">♡ 즐겨찾기만 보기</button><button class="btn" id="reset">↺ 초기화</button></div></section>
<section class="result-section"><div class="sectionbar"><div><h2>취향 저격 맛집 ✨</h2><p>원하는 조건에 맞춰 골라보세요.</p></div><div class="result-count" id="count" aria-live="polite"></div></div><div class="cards" id="cards"></div></section>
<p class="tip">📌 <strong>안내:</strong> 처음 표시되는 식당은 앱 사용법을 보여주기 위한 <strong>가상 예시</strong>입니다. 실제 매장 정보나 평점이 아닙니다. 직접 등록한 맛집과 즐겨찾기는 현재 브라우저에 저장됩니다. 지도 검색은 네이버 지도에서 확인하세요.</p>
<div class="footer">Made for delicious moments · 단일 HTML 오프라인 앱</div>
</main>
<div id="modalRoot"></div><div id="toastRoot" aria-live="polite"></div>
<script>
(()=>{
'use strict';
const KEY='foodpick-personal-v1', FAV='foodpick-favorites-v1';
const demo=[
{id:'d1',name:'보라식당 (예시)',area:'두정동',category:'한식',menu:'제육볶음 · 김치찌개',price:11000,rating:'-',desc:'든든한 집밥이 생각나는 날 추천하는 한식 스타일',emoji:'🍲',a:'#ffe3cd',b:'#ffc2bb'},
{id:'d2',name:'하루스시 (예시)',area:'두정동',category:'일식',menu:'초밥 · 사케동',price:17000,rating:'-',desc:'깔끔한 점심 한 끼를 위한 초밥 메뉴',emoji:'🍣',a:'#dcebf9',b:'#c7d7f8'},
{id:'d3',name:'오후의 파스타 (예시)',area:'성정동',category:'양식',menu:'크림파스타 · 리조또',price:16000,rating:'-',desc:'친구와 오래 이야기하며 즐기는 양식 메뉴',emoji:'🍝',a:'#fce4d5',b:'#f4c8c3'},
{id:'d4',name:'홍등반점 (예시)',area:'불당동',category:'중식',menu:'짜장면 · 짬뽕',price:9000,rating:'-',desc:'매콤하거나 고소한 중식이 당기는 날',emoji:'🍜',a:'#ffedd3',b:'#f5cb97'},
{id:'d5',name:'소담카페 (예시)',area:'두정동',category:'카페',menu:'아메리카노 · 샌드위치',price:9500,rating:'-',desc:'가벼운 브런치와 커피 한 잔을 즐기기 좋은 분위기',emoji:'☕',a:'#e9d7c7',b:'#cda9a0'},
{id:'d6',name:'골목돈카츠 (예시)',area:'쌍용동',category:'일식',menu:'등심카츠 · 치즈카츠',price:13000,rating:'-',desc:'바삭한 돈카츠를 고르고 싶은 날',emoji:'🍱',a:'#f8eabf',b:'#eccfa9'}
];
const $=s=>document.querySelector(s);
const clean=s=>String(s??'').trim();
const read=(key,fallback)=>{try{const a=JSON.parse(localStorage.getItem(key));return Array.isArray(a)?a:fallback}catch{return fallback}};
let personal=read(KEY,[]).filter(v=>v&&typeof v==='object'), fav=new Set(read(FAV,[]));let favOnly=false;
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(personal));localStorage.setItem(FAV,JSON.stringify([...fav]));}catch{toast('브라우저 저장 공간을 사용할 수 없습니다.')}};
const all=()=>[...personal,...demo];
const safe=t=>clean(t).replace(/[&<>"']/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));
const format=n=>Number(n).toLocaleString('ko-KR')+'원';
const colors={한식:['#ffe4c9','#f4c3b3','🍲'],일식:['#dceafa','#bed0f6','🍣'],중식:['#ffead3','#f6c898','🍜'],양식:['#f7e0d1','#f4bfba','🍝'],카페:['#e8ddd5','#caa8a0','☕'],기타:['#e8dcfa','#cbb8f6','🍽️']};
function areas(){const current=$('#area').value;const values=[...new Set(all().map(x=>clean(x.area)).filter(Boolean))].sort((a,b)=>a.localeCompare(b,'ko'));$('#area').innerHTML='<option value="">모든 지역</option>'+values.map(s=>'<option value="'+safe(s)+'">'+safe(s)+'</option>').join('');$('#area').value=values.includes(current)?current:'';}
function filtered(){const q=clean($('#search').value).toLowerCase();const area=$('#area').value,cat=$('#category').value,budget=Number($('#budget').value)||Infinity;return all().filter(x=>(!q||[x.name,x.area,x.menu,x.category,x.desc].join(' ').toLowerCase().includes(q))&&(!area||x.area===area)&&(!cat||x.category===cat)&&Number(x.price)<=budget&&(!favOnly||fav.has(x.id)));}
function render(){const data=filtered();$('#count').textContent=`총 ${data.length}곳`;$('#favorites').classList.toggle('active',favOnly);$('#favorites').textContent=favOnly?'♥ 즐겨찾기 보는 중':'♡ 즐겨찾기만 보기';$('#cards').innerHTML=data.length?data.map(x=>{const palette=colors[x.category]||colors['기타'];const a=x.a||palette[0],b=x.b||palette[1],emoji=x.emoji||palette[2];const isFav=fav.has(x.id);const map='https://map.naver.com/p/search/'+encodeURIComponent(x.name+' '+x.area);return `<article class="card"><div class="card-art" style="--a:${a};--b:${b}"><span class="category-pill">${safe(x.category)}</span><span class="dish" aria-hidden="true">${safe(emoji)}</span><button class="heart ${isFav?'saved':''}" data-fav="${safe(x.id)}" aria-label="${isFav?'즐겨찾기 해제':'즐겨찾기 추가'}">${isFav?'♥':'♡'}</button></div><div class="card-body"><div class="card-top"><div class="card-title" title="${safe(x.name)}">${safe(x.name)}</div><div class="rating">${x.user?'✦ 내 맛집':'데모'}</div></div><p class="desc">${safe(x.desc||x.menu)}</p><div class="meta"><span>📍 ${safe(x.area)}</span><span>🍽 ${safe(x.menu)}</span><span>💳 ${format(x.price)}</span></div><div class="card-bottom"><a class="map-link" href="${map}" target="_blank" rel="noopener noreferrer">네이버 지도에서 검색 ↗</a>${x.user?`<button class="remove" data-delete="${safe(x.id)}">삭제</button>`:'<span style="font-size:11px;color:#aaa">가상 예시</span>'}</div></div></article>`}).join(''):'<div class="empty"><div style="font-size:42px">🔎</div><strong>조건에 맞는 맛집이 없어요</strong>검색 조건을 바꾸거나 새로운 맛집을 등록해 보세요.</div>';}
let toastTimer;function toast(msg){const root=$('#toastRoot');root.innerHTML='<div class="toast">'+safe(msg)+'</div>';clearTimeout(toastTimer);toastTimer=setTimeout(()=>root.innerHTML='',2300)}
function close(){ $('#modalRoot').innerHTML=''; }
function random(){const items=filtered();if(!items.length){toast('조건에 맞는 식당이 없어요.');return;}const x=items[Math.floor(Math.random()*items.length)];const root=$('#modalRoot');root.innerHTML=`<div class="recommend" id="recommendOverlay"><div class="recommend-box" role="dialog" aria-modal="true" aria-labelledby="recommendTitle"><div class="recommend-emoji">${safe(x.emoji||colors[x.category]?.[2]||'🍽️')}</div><div class="eyebrow">🎉 오늘의 추천 메뉴</div><h2 id="recommendTitle">${safe(x.name)}</h2><p>${safe(x.menu)}<br>📍 ${safe(x.area)} · 약 ${format(x.price)} / 1인${!x.user?'<br><strong>가상 예시 식당입니다.</strong>':''}</p><div class="actions"><button class="btn primary" id="again">🎲 다시 뽑기</button><button class="btn" id="closeRecommend">닫기</button></div></div></div>`;$('#again').onclick=random;$('#closeRecommend').onclick=close;$('#recommendOverlay').onclick=e=>{if(e.target.id==='recommendOverlay')close()};}
function addModal(){const root=$('#modalRoot');root.innerHTML=`<div class="modal-wrap" id="modalOverlay"><div class="modal" role="dialog" aria-modal="true" aria-labelledby="addTitle"><h2 id="addTitle">＋ 나만의 맛집 추가</h2><p class="hint">직접 가봤거나 가보고 싶은 식당을 저장하세요. 추가된 식당은 브라우저에 보관됩니다.</p><form id="addForm"><div class="modal-grid"><div class="field wide"><label for="newName">식당 이름 *</label><input id="newName" maxlength="50" placeholder="예: 우리동네 맛집" required></div><div class="field"><label for="newArea">지역 *</label><input id="newArea" maxlength="25" placeholder="예: 두정동" required></div><div class="field"><label for="newCategory">음식 종류 *</label><select id="newCategory"><option>한식</option><option>일식</option><option>중식</option><option>양식</option><option>카페</option><option>기타</option></select></div><div class="field wide"><label for="newMenu">대표 메뉴 *</label><input id="newMenu" maxlength="80" placeholder="예: 비빔밥, 된장찌개" required></div><div class="field"><label for="newPrice">1인 예상 가격 (원) *</label><input id="newPrice" type="number" min="1000" max="1000000" step="500" value="12000" required></div><div class="field"><label for="newDesc">한 줄 메모</label><input id="newDesc" maxlength="100" placeholder="예: 친구와 점심 먹기 좋아요"></div></div><div class="modal-footer"><button type="button" class="btn" id="cancelAdd">취소</button><button type="submit" class="btn primary">맛집 저장하기</button></div></form></div></div>`;$('#cancelAdd').onclick=close;$('#modalOverlay').onclick=e=>{if(e.target.id==='modalOverlay')close()};$('#newName').focus();$('#addForm').onsubmit=e=>{e.preventDefault();const name=clean($('#newName').value),area=clean($('#newArea').value),menu=clean($('#newMenu').value),price=Number($('#newPrice').value),category=$('#newCategory').value,desc=clean($('#newDesc').value);if(!name||!area||!menu||!Number.isFinite(price)||price<1000||price>1000000){toast('필수 항목과 가격을 확인해 주세요.');return;}personal.unshift({id:'u'+Date.now().toString(36)+Math.random().toString(36).slice(2,6),name,area,menu,price,category,desc,user:true});save();close();$('#search').value='';$('#category').value='';$('#budget').value='';favOnly=false;areas();$('#area').value='';render();toast('새 맛집이 저장되었습니다!');};}
$('#cards').addEventListener('click',e=>{const f=e.target.closest('[data-fav]');if(f){const id=f.dataset.fav;fav.has(id)?fav.delete(id):fav.add(id);save();render();return;}const d=e.target.closest('[data-delete]');if(d){if(!confirm('이 맛집을 삭제할까요?'))return;const id=d.dataset.delete;personal=personal.filter(x=>x.id!==id);fav.delete(id);save();areas();render();toast('맛집을 삭제했습니다.');}});
['search','area','category','budget'].forEach(id=>$('#'+id).addEventListener(id==='search'?'input':'change',render));$('#random').onclick=random;$('#add').onclick=addModal;$('#favorites').onclick=()=>{favOnly=!favOnly;render()};$('#reset').onclick=()=>{$('#search').value='';$('#area').value='';$('#category').value='';$('#budget').value='';favOnly=false;render();toast('검색 조건을 초기화했습니다.')};document.addEventListener('keydown',e=>{if(e.key==='Escape')close()});areas();render();
})();
</script>
</body>
</html>
